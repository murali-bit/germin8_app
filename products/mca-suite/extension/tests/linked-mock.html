const root = document.getElementById('form');

let seq = 0;
function node(path, kind, o) {
  const name = PFX + path + '___jqName', id = PFX + path + '__' + (++seq);
  const wrap = document.createElement('div');
  wrap.className = 'guideFieldNode' + (o.caro ? ' caro' : '');
  const lab = document.createElement('label');
  lab.textContent = (o.required ? '* ' : '') + (o.label || path);
  wrap.appendChild(lab);
  let el;
  if (kind === 'textarea') el = document.createElement('textarea');
  else if (kind === 'select') { el = document.createElement('select'); o.options.forEach((t, i) => el.appendChild(new Option(t, i ? 'V' + i : ''))); }
  else if (kind === 'radio') {
    for (const [i, t] of ['Yes', 'No'].entries()) {
      const r = document.createElement('input');
      r.type = 'radio'; r.name = name; r.value = t === 'Yes' ? '1' : '0'; r.setAttribute('aria-label', t); r.id = id + '-' + i + '_widget';
      const l = document.createElement('label'); l.htmlFor = r.id; l.textContent = t; l.style.display = 'inline';
      wrap.append(r, l);
      if (path.endsWith('_1904032734-panel-guideradiobutton')) r.addEventListener('change', caroToggle);
    }
    wrap.appendChild(Object.assign(document.createElement('div'), { className: 'guideFieldError' }));
    root.appendChild(wrap); wrap.dataset.required = o.required ? '1' : ''; wrap.dataset.kind = 'radio';
    return;
  } else if (kind === 'upload' || kind === 'button') {
    wrap.id = PFX + path + '__';
    const b = document.createElement('button');
    b.type = 'button'; b.name = name; b.id = PFX + path + '_widget'; b.textContent = kind === 'upload' ? 'Upload' : o.text;
    if (kind === 'upload') b.addEventListener('click', () => mockUpload(o.panel));
    wrap.appendChild(b); root.appendChild(wrap); return;
  } else { el = document.createElement('input'); el.type = 'text'; if (kind === 'date') el.placeholder = 'DD/MM/YYYY'; }
  if (kind === 'hiddenjson') { el.style.display = 'none'; el.setAttribute('aria-label', o.aria); }
  el.name = name; el.id = id + '_widget';
  if (o.readonly) el.readOnly = true;
  if (o.value != null) el.value = o.value;
  if (o.caro) el.disabled = true;
  wrap.appendChild(el);
  wrap.appendChild(Object.assign(document.createElement('div'), { className: 'guideFieldError' }));
  wrap.dataset.required = o.required ? '1' : '';
  root.appendChild(wrap);
}
function caroToggle() {
  const yes = [...document.querySelectorAll('input[type=radio]')].find(r => r.name.endsWith('_1904032734-panel-guideradiobutton___jqName') && r.checked && r.getAttribute('aria-label') === 'Yes');
  document.querySelectorAll('.caro select, .caro textarea').forEach(e => { e.disabled = !yes; });
}

// Board-meeting table: one row; more only through guideBridge instanceManager.addInstance().
function meetingsTable() {
  const t = document.createElement('table'); t.className = 'rows'; t.id = 'meetings';
  t.innerHTML = '<tr><th>Date</th><th>Total</th><th>Attended</th><th>%</th></tr>';
  root.appendChild(t);
  const addRow = () => {
    const tr = document.createElement('tr'); tr.className = 'guideTableRuntimeRow';
    for (const c of ['tableItem1642490503676', 'tableItem1642490503677', 'tableItem1642490503678', 'tableItem1642490503679']) {
      const td = document.createElement('td'); const i = document.createElement('input');
      i.name = PFX + B + 'panel_892374834-' + ROW + '-' + c + '___jqName';
      if (c.endsWith('676')) i.placeholder = 'DD/MM/YYYY';
      td.appendChild(i); tr.appendChild(td);
    }
    t.appendChild(tr);
  };
  addRow();
  components.push({ id: PFX + B + 'panel_892374834-' + ROW, instanceManager: {
    get instanceCount() { return t.querySelectorAll('tr.guideTableRuntimeRow').length; },
    addInstance() { setTimeout(addRow, 120); window.__log.push('addInstance'); },
  } });
}

for (const [p, k, o] of FIELDS[FORM] || []) { if (k === 'meetings') meetingsTable(); else node(p, k, o); }
window.guideBridge = { visit(cb) { components.forEach(cb); } };

function modal(msg) {
  const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('role', 'dialog');
  m.innerHTML = '<p></p><button type="button">OK</button>'; m.querySelector('p').textContent = msg;
  m.querySelector('button').onclick = () => m.remove(); document.body.appendChild(m);
}

// AOC-2 Upload: MCA's script creates a file input on click and clicks it (no static input).
function mockUpload(panel) {
  window.__log.push('upload:' + panel);
  const inp = document.createElement('input'); inp.type = 'file'; inp.style.display = 'none'; inp.accept = '.xlsm';
  inp.addEventListener('change', () => {
    const f = inp.files[0];
    window.__log.push('file:' + (f && f.name) + ':' + (f && f.size));
    setTimeout(() => {
      const countName = panel === 'atArm' ? A + 'panel_copy_copy-panel_885569515-guidetextbox' : A + 'panel-guidetextbox';
      const n = Number(document.querySelector(`[name="${PFX + countName}___jqName"]`).value || 0);
      if (!f || !/\.xlsm$/i.test(f.name) || !n) { modal('Number of records entered in Excel File donot match with the number of contracts entered'); return; }
      if (panel === 'atArm') document.querySelector('[aria-label="atArmSubmitData"]').value = JSON.stringify(Array.from({ length: n }, (_, i) => ({ sr: i + 1 })));
      modal('File uploaded successfully');
    }, 400);
  });
  document.body.appendChild(inp);
  inp.click();
}

document.getElementById('save').onclick = () => {
  window.__saveClicks++; window.__log.push('save');
  let bad = 0;
  document.querySelectorAll('.guideFieldNode').forEach(w => {
    const err = w.querySelector('.guideFieldError'); if (!err) return;
    let empty;
    if (w.dataset.kind === 'radio') empty = ![...w.querySelectorAll('input[type=radio]')].some(r => r.checked);
    else { const el = w.querySelector('input, textarea, select'); empty = !el.disabled && !el.readOnly && !String(el.value).trim(); }
    err.textContent = w.dataset.required && empty ? 'This field is required' : '';
    if (err.textContent) bad++;
  });
  if (FORM === 'aoc2') {
    const n = Number(document.querySelector(`[name="${PFX + A}panel_copy_copy-panel_885569515-guidetextbox___jqName"]`).value || 0);
    const data = document.querySelector('[aria-label="atArmSubmitData"]').value;
    if (n && !data) { bad++; document.querySelectorAll('.guideFieldError')[1].textContent = 'Please upload the Excel'; }
  }
  if (!bad) setTimeout(() => modal('Data Added Successfully'), 500);
};
document.getElementById('proceed').onclick = () => { window.__proceedClicks++; window.__log.push('proceed'); setTimeout(() => { document.getElementById('form').innerHTML = '<h3>Proceeded (mock)</h3>'; }, 300); };
document.getElementById('submit').onclick = () => { window.__submitClicks++; window.__log.push('SUBMIT'); };
</script>

  BOARD_MEETINGS: JSON.stringify([{ date: '15/05/2025', total: 3, attended: 3 }, { date: '20/08/2025', total: 3, attended: 3 }, { date: '18/11/2025', total: 3, attended: 2 }, { date: '16/02/2026', total: 3, attended: 3 }]),
  EMP_FEMALE: '1', EMP_MALE: '2', EMP_TRANSGENDER: '0', WEBSITE: '', DIRECTOR_CHANGES: 'None', HAS_SUBSIDIARY_OR_JV: 'No',
};

// Same order as lfRun: pre-steps → one pageFill → Save → confirm → Proceed. Runs in this page (no extension).
async function selfTest() {
  const out = document.getElementById('out');
  const F = (window.LINKED_FORMS || {})[FORM];
  if (!F) { out.textContent = 'module js/linked/' + FORM + '.js not loaded'; return; }
  const log = []; const t = Date.now(); const step = (k, v) => { log.push([k, Date.now() - t, v]); out.textContent = JSON.stringify(log, null, 1); };
  // ?job=<id>: use that job's payload and the company-master answers from the local backend instead of the fixture.
  let client = CLIENT, answers = ANSWERS;
  const jobId = new URLSearchParams(location.search).get('job');
  if (jobId) {
    const API = 'http://localhost:4000';
    const j = await (await fetch(`${API}/api/extension/jobs/${encodeURIComponent(jobId)}`)).json();
    let p = (j.job || j).payload; if (typeof p === 'string') p = JSON.parse(p);
    client = p.client || p.data || p;
    const get = async f => Object.fromEntries(((await (await fetch(`${API}/api/company-answers?cin=${client.general.CIN}&form=${f}`)).json()).answers || []).map(x => [x.field_key, x.value]));
    const forms = ['aoc4', ...(F.extraAnswers || []), F.answersForm].filter((f, i, a) => f && a.indexOf(f) === i);
    answers = Object.assign({}, ...(await Promise.all(forms.map(get))));
    step('live', { job: jobId, cin: client.general.CIN, answerForms: forms, answerKeys: Object.keys(answers).length });
  }
  const b = F.buildData(client, answers);
  step('build', { missing: b.missing.map(m => m.key + (m.optional ? '?' : '')), notes: b.notes });
  const v = { ...b.values };
  for (const p of F.pre || []) {
    if (p.skip && p.skip(v)) { step('pre-skip', p.label); continue; }
    if (p.prepare) {
      try { await p.prepare(v); } catch (e) { v.__AOC2_EXCEL = { base64: btoa('PK-mock-excel'), fileName: 'AOC-2_mock.xlsm' }; step('prepare-fallback', e.message); }
    }
    step('pre:' + p.label, await p.func(...p.args(v)));
  }
  const jobs = F.jobs(b.values);
  const r = await pageFill(jobs);
  const rows = lfFieldRows(jobs, r.results);
  step('fill', { counts: rows.counts, failed: rows.rows.filter(x => x.status !== 'filled') });
  step('save', pageLinkedClickSave());
  step('confirm', await pageLinkedConfirmSave(3000));
  if (F.nextButton === 'Proceed' && document.getElementById('stProceed').checked) step('proceed', pageLinkedProceed());
  step('clicks', { save: window.__saveClicks, proceed: window.__proceedClicks, submit: window.__submitClicks, log: window.__log });
  window.__selfTest = log;
  return log;
}
document.getElementById('selftest').onclick = selfTest;
</script>
